version: 1
services:
  - type: web
    name: rentmyride-backend
    env: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install && npx prisma generate --schema=prisma/app.schema.prisma
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL_APP
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5001
